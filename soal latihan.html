        const { useState, useEffect, useRef } = React;

        function App() {
            // Screen tracking: 'login' | 'instruction' | 'exam' | 'result'
            const [screen, setScreen] = useState('login');
            
            // Student Identity Info
            const [student, setStudent] = useState({
                name: '',
                nim: '',
                classGroup: ''
            });

            // Exam progress tracking
            const [answers, setAnswers] = useState({}); // { questionId: optionIndex }
            const [markedReview, setMarkedReview] = useState({}); // { questionId: boolean }
            const [currentIdx, setCurrentIdx] = useState(0);
            
            // Timer state: 90 Minutes (5400 seconds)
            const [timeLeft, setTimeLeft] = useState(5400); 
            const [isTimerActive, setIsTimerActive] = useState(false);
            const timerRef = useRef(null);

            // Modal & Navigation Helper State
            const [showSubmitModal, setShowSubmitModal] = useState(false);
            const [agreeTerms, setAgreeTerms] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            // Score evaluation states
            const [result, setResult] = useState({
                score: 0,
                correctCount: 0,
                wrongCount: 0,
                unansweredCount: 0
            });

            useEffect(() => {
                if (isTimerActive && timeLeft > 0) {
                    timerRef.current = setInterval(() => {
                        setTimeLeft((prev) => {
                            if (prev <= 1) {
                                clearInterval(timerRef.current);
                                handleAutoSubmit();
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                } else if (!isTimerActive) {
                    clearInterval(timerRef.current);
                }
                return () => clearInterval(timerRef.current);
            }, [isTimerActive, timeLeft]);

            // Format seconds to HH:MM:SS
            const formatTime = (seconds) => {
                const hrs = Math.floor(seconds / 3600);
                const mins = Math.floor((seconds % 3600) / 60);
                const secs = seconds % 60;
                return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            const handleLoginSubmit = (e) => {
                e.preventDefault();
                setErrorMsg('');

                if (!student.name.trim() || student.name.trim().length < 3) {
                    setErrorMsg('Nama lengkap harus diisi minimal 3 karakter.');
                    return;
                }
                if (!student.nim.trim() || !/^\d+$/.test(student.nim)) {
                    setErrorMsg('NIM harus diisi dengan angka valid.');
                    return;
                }
                if (!student.classGroup.trim()) {
                    setErrorMsg('Kelas harus dipilih / diisi.');
                    return;
                }

                setScreen('instruction');
            };

            const startExam = () => {
                if (!agreeTerms) return;
                setIsTimerActive(true);
                setScreen('exam');
            };

            const selectOption = (questionId, optionIndex) => {
                setAnswers(prev => ({
                    ...prev,
                    [questionId]: optionIndex
                }));
            };

            const toggleMarkReview = (questionId) => {
                setMarkedReview(prev => ({
                    ...prev,
                    [questionId]: !prev[questionId]
                }));
            };

            const navigateTo = (index) => {
                if (index >= 0 && index < QUESTIONS_DATABASE.length) {
                    setCurrentIdx(index);
                }
            };

            const calculateResults = () => {
                let correct = 0;
                let wrong = 0;
                let unanswered = 0;

                QUESTIONS_DATABASE.forEach(q => {
                    const studentAnswer = answers[q.id];
                    if (studentAnswer === undefined) {
                        unanswered++;
                    } else if (studentAnswer === q.correctIndex) {
                        correct++;
                    } else {
                        wrong++;
                    }
                });

                const rawScore = (correct / QUESTIONS_DATABASE.length) * 100;
                // Round score to 2 decimal places
                const finalScore = Math.round((rawScore + Number.EPSILON) * 100) / 100;

                setResult({
                    score: finalScore,
                    correctCount: correct,
                    wrongCount: wrong,
                    unansweredCount: unanswered
                });
            };

            const handleSubmitExam = () => {
                setIsTimerActive(false);
                calculateResults();
                setScreen('result');
                setShowSubmitModal(false);
            };

            const handleAutoSubmit = () => {
                setIsTimerActive(false);
                calculateResults();
                setScreen('result');
                setShowSubmitModal(false);
            };

            const restartAll = () => {
                setStudent({ name: '', nim: '', classGroup: '' });
                setAnswers({});
                setMarkedReview({});
                setCurrentIdx(0);
                setTimeLeft(5400);
                setIsTimerActive(false);
                setAgreeTerms(false);
                setScreen('login');
            };

            // Calculate progress percentage
            const answeredTotal = Object.keys(answers).length;
            const progressPercent = Math.round((answeredTotal / QUESTIONS_DATABASE.length) * 100);

            return (
                <div class="min-h-screen flex flex-col justify-between">
                    {/* Header bar */}
                    <header class="bg-indigo-900 text-white shadow-md py-4 px-6 sticky top-0 z-30">
                        <div class="max-w-7xl mx-auto flex justify-between items-center">
                            <div class="flex items-center space-x-3">
                                <div class="bg-indigo-600 p-2 rounded-lg text-white">
                                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                                </div>
                                <div>
                                    <h1 class="font-extrabold text-lg tracking-tight">CBT MAHASISWA</h1>
                                    <p class="text-xs text-indigo-200">Ujian Komputer dan Masyarakat</p>
                                </div>
                            </div>
                            
                            {screen === 'exam' && (
                                <div class="flex items-center space-x-4 bg-indigo-950 px-4 py-2 rounded-lg border border-indigo-700">
                                    <i class="fa-regular fa-clock text-indigo-300 animate-pulse"></i>
                                    <div class="text-right">
                                        <p class="text-[10px] text-indigo-300 uppercase font-semibold">Sisa Waktu</p>
                                        <p class={`font-mono text-lg font-bold tracking-wider ${timeLeft < 600 ? 'text-red-400' : 'text-emerald-400'}`}>
                                            {formatTime(timeLeft)}
                                        </p>
                                    </div>
                                </div>
                            )}
                        </div>
                    </header>

                    {/* Main content container */}
                    <main class="flex-grow py-8 px-4 max-w-7xl mx-auto w-full">
                        {/* SCREEN 1: LOGIN FORM */}
                        {screen === 'login' && (
                            <div class="max-w-md mx-auto my-12 bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
                                <div class="bg-gradient-to-r from-indigo-800 to-indigo-950 p-8 text-white text-center">
                                    <div class="inline-flex bg-indigo-600/30 p-4 rounded-full mb-3">
                                        <i class="fa-solid fa-user-shield text-3xl text-indigo-200"></i>
                                    </div>
                                    <h2 class="text-2xl font-bold">Portal Ujian Online</h2>
                                    <p class="text-indigo-200 text-sm mt-1">Lengkapi data Anda dengan teliti</p>
                                </div>
                                <form onSubmit={handleLoginSubmit} class="p-8 space-y-6">
                                    {errorMsg && (
                                        <div class="bg-red-50 border-l-4 border-red-500 p-4 text-red-700 text-sm rounded flex items-center space-x-2">
                                            <i class="fa-solid fa-circle-exclamation text-red-500"></i>
                                            <span>{errorMsg}</span>
                                        </div>
                                    )}
                                    <div class="space-y-2">
                                        <label class="block text-sm font-semibold text-slate-700">Nama Lengkap Mahasiswa</label>
                                        <div class="relative">
                                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                                <i class="fa-regular fa-user"></i>
                                            </span>
                                            <input 
                                                type="text" 
                                                required
                                                placeholder="Contoh: Budi Santoso"
                                                value={student.name}
                                                onChange={(e) => setStudent({...student, name: e.target.value})}
                                                class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-slate-800 placeholder:text-slate-400"
                                            />
                                        </div>
                                    </div>

                                    <div class="space-y-2">
                                        <label class="block text-sm font-semibold text-slate-700">NIM (Nomor Induk Mahasiswa)</label>
                                        <div class="relative">
                                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                                <i class="fa-solid fa-address-card"></i>
                                            </span>
                                            <input 
                                                type="text" 
                                                required
                                                placeholder="Contoh: 2204010100"
                                                value={student.nim}
                                                onChange={(e) => setStudent({...student, nim: e.target.value})}
                                                class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-slate-800 placeholder:text-slate-400"
                                            />
                                        </div>
                                    </div>

                                    <div class="space-y-2">
                                        <label class="block text-sm font-semibold text-slate-700">Kelas</label>
                                        <div class="relative">
                                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                                <i class="fa-solid fa-school"></i>
                                            </span>
                                            <select 
                                                required
                                                value={student.classGroup}
                                                onChange={(e) => setStudent({...student, classGroup: e.target.value})}
                                                class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-slate-800 bg-white"
                                            >
                                                <option value="">-- Pilih Kelas --</option>
                                                <option value="IK-1A">IK-1A (Informatika 1A)</option>
                                                <option value="IK-1B">IK-1B (Informatika 1B)</option>
                                                <option value="SI-3A">SI-3A (Sistem Informasi 3A)</option>
                                                <option value="SI-3B">SI-3B (Sistem Informasi 3B)</option>
                                                <option value="KA-5A">KA-5A (Komputer Akuntansi 5A)</option>
                                            </select>
                                        </div>
                                    </div>

                                    <button 
                                        type="submit" 
                                        class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow-lg shadow-indigo-600/20 hover:shadow-indigo-700/30 transition-all flex items-center justify-center space-x-2"
                                    >
                                        <span>Masuk Portal Ujian</span>
                                        <i class="fa-solid fa-arrow-right"></i>
                                    </button>
                                </form>
                            </div>
                        )}

                        {/* SCREEN 2: EXAM RULES & CONFIRMATION */}
                        {screen === 'instruction' && (
                            <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl border border-slate-100 p-8 space-y-6">
                                <h2 class="text-2xl font-extrabold text-indigo-900 border-b pb-4 flex items-center space-x-2">
                                    <i class="fa-solid fa-circle-info"></i>
                                    <span>Petunjuk Pelaksanaan Ujian</span>
                                </h2>
                                
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50 p-6 rounded-xl border border-slate-100">
                                    <div>
                                        <p class="text-xs text-slate-400 uppercase font-bold">Materi Ujian</p>
                                        <p class="font-bold text-slate-800">Komputer dan Masyarakat</p>
                                    </div>
                                    <div>
                                        <p class="text-xs text-slate-400 uppercase font-bold">Jumlah Soal</p>
                                        <p class="font-bold text-slate-800">50 Soal Pilihan Ganda</p>
                                    </div>
                                    <div class="mt-2">
                                        <p class="text-xs text-slate-400 uppercase font-bold">Durasi Uaktu</p>
                                        <p class="font-bold text-slate-800">90 Menit (01:30:00)</p>
                                    </div>
                                    <div class="mt-2">
                                        <p class="text-xs text-slate-400 uppercase font-bold">Kategori Peserta</p>
                                        <p class="font-bold text-slate-800">{student.name} ({student.nim}) - Kelas {student.classGroup}</p>
                                    </div>
                                </div>

                                <div class="space-y-3 text-slate-600 text-sm leading-relaxed">
                                    <p class="font-semibold text-slate-800">Harap perhatikan ketentuan di bawah ini sebelum memulai:</p>
                                    <ul class="list-disc pl-5 space-y-2">
                                        <li>Jawaban yang dipilih akan disimpan otomatis secara instan.</li>
                                        <li>Gunakan navigasi nomor soal di bagian samping untuk melompat langsung ke soal tertentu.</li>
                                        <li>Anda dapat menandai soal dengan status <span class="bg-amber-100 text-amber-800 font-semibold px-2 py-0.5 rounded">Ragu-ragu</span> jika masih belum yakin dengan jawabannya.</li>
                                        <li>Ujian akan diakhiri secara paksa (auto-submit) apabila hitungan waktu mundur habis.</li>
                                        <li>Hasil nilai, statistik kelulusan, kunci jawaban, dan pembahasan mendalam akan disajikan langsung setelah ujian dikirimkan.</li>
                                    </ul>
                                </div>

                                <div class="p-4 bg-indigo-50 rounded-xl border border-indigo-100 flex items-start space-x-3">
                                    <input 
                                        type="checkbox" 
                                        id="terms" 
                                        checked={agreeTerms}
                                        onChange={(e) => setAgreeTerms(e.target.checked)}
                                        class="mt-1 h-5 w-5 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500"
                                    />
                                    <label htmlFor="terms" class="text-slate-700 text-sm select-none cursor-pointer">
                                        Saya menyatakan bersedia mengikuti ujian secara jujur, mandiri, tanpa kecurangan, dan siap mematuhi segala tata tertib ujian yang berlaku.
                                    </label>
                                </div>

                                <div class="flex space-x-4 pt-4 border-t">
                                    <button 
                                        onClick={() => setScreen('login')}
                                        class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition-all"
                                    >
                                        Kembali
                                    </button>
                                    <button 
                                        onClick={startExam}
                                        disabled={!agreeTerms}
                                        class={`flex-1 py-3 font-bold rounded-xl transition-all flex items-center justify-center space-x-2 ${
                                            agreeTerms 
                                            ? 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-lg shadow-emerald-600/20' 
                                            : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                                        }`}
                                    >
                                        <i class="fa-solid fa-play"></i>
                                        <span>Mulai Ujian Sekarang</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* SCREEN 3: THE MAIN EXAM CBT INTERFACE */}
                        {screen === 'exam' && (
                            <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
                                
                                {/* Left Side: Question Pane */}
                                <div class="lg:col-span-3 space-y-6">
                                    {/* Question Card Header */}
                                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 flex justify-between items-center">
                                        <span class="bg-indigo-100 text-indigo-800 text-xs font-extrabold tracking-wider px-3 py-1.5 rounded-full uppercase">
                                            Soal {currentIdx + 1} dari {QUESTIONS_DATABASE.length}
                                        </span>
                                        <button 
                                            onClick={() => toggleMarkReview(QUESTIONS_DATABASE[currentIdx].id)}
                                            class={`px-4 py-2 rounded-xl text-sm font-bold flex items-center space-x-2 transition-all ${
                                                markedReview[QUESTIONS_DATABASE[currentIdx].id]
                                                ? 'bg-amber-500 text-white shadow-lg shadow-amber-500/20'
                                                : 'bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200'
                                            }`}
                                        >
                                            <i class="fa-solid fa-flag"></i>
                                            <span>Ragu-ragu</span>
                                        </button>
                                    </div>

                                    {/* Question body */}
                                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-8 space-y-8">
                                        <h3 class="text-lg md:text-xl font-bold text-slate-800 leading-relaxed">
                                            {QUESTIONS_DATABASE[currentIdx].question}
                                        </h3>

                                        {/* Options Grid */}
                                        <div class="space-y-4">
                                            {QUESTIONS_DATABASE[currentIdx].options.map((opt, oIdx) => {
                                                const isSelected = answers[QUESTIONS_DATABASE[currentIdx].id] === oIdx;
                                                return (
                                                    <div 
                                                        key={oIdx}
                                                        onClick={() => selectOption(QUESTIONS_DATABASE[currentIdx].id, oIdx)}
                                                        class={`group cursor-pointer flex items-start space-x-4 p-5 rounded-xl border-2 transition-all duration-200 ${
                                                            isSelected 
                                                            ? 'border-indigo-600 bg-indigo-50/50 shadow-md shadow-indigo-600/5' 
                                                            : 'border-slate-100 hover:border-indigo-200 hover:bg-slate-50/50'
                                                        }`}
                                                    >
                                                        <div class={`flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center font-bold text-sm transition-all ${
                                                            isSelected 
                                                            ? 'bg-indigo-600 text-white' 
                                                            : 'bg-slate-100 text-slate-600 group-hover:bg-indigo-100 group-hover:text-indigo-700'
                                                        }`}>
                                                            {String.fromCharCode(65 + oIdx)}
                                                        </div>
                                                        <div class="flex-grow text-slate-700 font-medium text-sm md:text-base leading-relaxed">
                                                            {opt.substring(3)}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    {/* Question navigation footer */}
                                    <div class="flex justify-between items-center">
                                        <button 
                                            onClick={() => navigateTo(currentIdx - 1)}
                                            disabled={currentIdx === 0}
                                            class={`px-6 py-3 rounded-xl font-bold text-sm flex items-center space-x-2 transition-all ${
                                                currentIdx === 0
                                                ? 'bg-slate-200 text-slate-400 cursor-not-allowed'
                                                : 'bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 shadow-sm'
                                            }`}
                                        >
                                            <i class="fa-solid fa-chevron-left text-xs"></i>
                                            <span>Sebelumnya</span>
                                        </button>

                                        <button 
                                            onClick={() => {
                                                if (currentIdx === QUESTIONS_DATABASE.length - 1) {
                                                    setShowSubmitModal(true);
                                                } else {
                                                    navigateTo(currentIdx + 1);
                                                }
                                            }}
                                            class={`px-6 py-3 rounded-xl font-bold text-sm flex items-center space-x-2 transition-all ${
                                                currentIdx === QUESTIONS_DATABASE.length - 1
                                                ? 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-lg shadow-emerald-600/20'
                                                : 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-lg shadow-indigo-600/20'
                                            }`}
                                        >
                                            <span>{currentIdx === QUESTIONS_DATABASE.length - 1 ? 'Selesai Ujian' : 'Selanjutnya'}</span>
                                            <i class={`fa-solid ${currentIdx === QUESTIONS_DATABASE.length - 1 ? 'fa-circle-check' : 'fa-chevron-right'} text-xs`}></i>
                                        </button>
                                    </div>
                                </div>

                                {/* Right Side: Student Profile & Navigation Grid */}
                                <div class="space-y-6">
                                    {/* Small Student Profile Card */}
                                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 space-y-3">
                                        <h4 class="text-xs font-extrabold uppercase text-slate-400 tracking-wider">Identitas Peserta</h4>
                                        <div class="space-y-1">
                                            <p class="font-bold text-slate-800 leading-tight truncate">{student.name}</p>
                                            <p class="text-xs text-slate-500 font-mono">NIM: {student.nim}</p>
                                            <p class="text-xs text-slate-500">Kelas: <span class="bg-slate-100 text-slate-700 px-1.5 py-0.5 rounded font-bold">{student.classGroup}</span></p>
                                        </div>
                                    </div>

                                    {/* Navigation Grid of 50 numbers */}
                                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 space-y-4">
                                        <div class="flex justify-between items-center">
                                            <h4 class="text-xs font-extrabold uppercase text-slate-400 tracking-wider">Navigasi Soal</h4>
                                            <span class="text-xs bg-slate-100 text-slate-700 px-2 py-0.5 rounded-full font-bold">
                                                {answeredTotal}/50
                                            </span>
                                        </div>

                                        {/* Status legends */}
                                        <div class="grid grid-cols-3 gap-2 text-[10px] text-center border-b pb-3 text-slate-600">
                                            <div class="flex flex-col items-center">
                                                <span class="w-3.5 h-3.5 rounded bg-emerald-500 mb-1 inline-block"></span>
                                                <span>Dijawab</span>
                                            </div>
                                            <div class="flex flex-col items-center">
                                                <span class="w-3.5 h-3.5 rounded bg-amber-400 mb-1 inline-block"></span>
                                                <span>Ragu-ragu</span>
                                            </div>
                                            <div class="flex flex-col items-center">
                                                <span class="w-3.5 h-3.5 rounded bg-slate-200 mb-1 inline-block"></span>
                                                <span>Belum</span>
                                            </div>
                                        </div>

                                        {/* Grid generator */}
                                        <div class="grid grid-cols-5 gap-2 max-h-[300px] overflow-y-auto pr-1">
                                            {QUESTIONS_DATABASE.map((q, idx) => {
                                                const isAnswered = answers[q.id] !== undefined;
                                                const isMarked = markedReview[q.id];
                                                const isActive = idx === currentIdx;

                                                let btnClass = "bg-slate-100 text-slate-700 hover:bg-slate-200"; // default: unanswered
                                                if (isMarked) {
                                                    btnClass = "bg-amber-400 text-amber-950 font-bold hover:bg-amber-500";
                                                } else if (isAnswered) {
                                                    btnClass = "bg-emerald-500 text-white font-bold hover:bg-emerald-600";
                                                }

                                                const activeOutline = isActive ? "ring-2 ring-indigo-600 ring-offset-2 scale-105" : "";

                                                return (
                                                    <button 
                                                        key={idx}
                                                        onClick={() => navigateTo(idx)}
                                                        class={`h-10 text-xs rounded-xl font-bold transition-all flex items-center justify-center ${btnClass} ${activeOutline}`}
                                                    >
                                                        {idx + 1}
                                                    </button>
                                                );
                                            })}
                                        </div>

                                        {/* Quick Action submit */}
                                        <button 
                                            onClick={() => setShowSubmitModal(true)}
                                            class="w-full mt-2 py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl font-bold text-sm shadow-lg shadow-red-600/10 transition-all flex items-center justify-center space-x-2"
                                        >
                                            <i class="fa-solid fa-flag-checkered"></i>
                                            <span>Kirim Jawaban Sekarang</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* SCREEN 4: EVALUATION & ANALYSIS RESULTS */}
                        {screen === 'result' && (
                            <div class="space-y-8 animate-fade-in">
                                {/* Main stats banner */}
                                <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
                                    <div class="bg-gradient-to-r from-indigo-900 to-indigo-950 p-8 text-white">
                                        <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                                            <div>
                                                <span class="bg-indigo-600/50 text-indigo-200 text-xs font-bold px-3 py-1.5 rounded-full uppercase tracking-wider">Ujian Berakhir</span>
                                                <h2 class="text-2xl md:text-3xl font-extrabold mt-2">Hasil Penilaian Ujian</h2>
                                                <p class="text-indigo-200 mt-1 text-sm">Terima kasih telah berpartisipasi dalam ujian ini secara mandiri.</p>
                                            </div>
                                            
                                            {/* Score Ring Display */}
                                            <div class="flex-shrink-0 bg-white/10 backdrop-blur-md p-6 rounded-2xl border border-white/20 text-center min-w-[160px]">
                                                <p class="text-xs uppercase text-indigo-300 font-semibold tracking-widest">Skor Akhir</p>
                                                <p class="text-5xl font-black mt-1 text-emerald-400">{result.score}</p>
                                                <p class="text-[10px] text-indigo-200 mt-1 font-medium">Skala Maksimum 100</p>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Breakdown stats bar */}
                                    <div class="grid grid-cols-2 md:grid-cols-4 divide-x divide-y md:divide-y-0 divide-slate-100 bg-slate-50 border-b border-slate-100">
                                        <div class="p-6 text-center">
                                            <p class="text-xs text-slate-400 uppercase font-bold tracking-wider">Nama Peserta</p>
                                            <p class="font-extrabold text-slate-800 text-lg truncate mt-1">{student.name}</p>
                                            <p class="text-xs text-slate-500 font-mono mt-0.5">{student.nim}</p>
                                        </div>
                                        <div class="p-6 text-center">
                                            <p class="text-xs text-slate-400 uppercase font-bold tracking-wider">Benar</p>
                                            <p class="font-extrabold text-emerald-600 text-2xl mt-1 flex items-center justify-center space-x-1.5">
                                                <i class="fa-regular fa-circle-check text-base"></i>
                                                <span>{result.correctCount}</span>
                                            </p>
                                        </div>
                                        <div class="p-6 text-center">
                                            <p class="text-xs text-slate-400 uppercase font-bold tracking-wider">Salah</p>
                                            <p class="font-extrabold text-red-600 text-2xl mt-1 flex items-center justify-center space-x-1.5">
                                                <i class="fa-regular fa-circle-xmark text-base"></i>
                                                <span>{result.wrongCount}</span>
                                            </p>
                                        </div>
                                        <div class="p-6 text-center">
                                            <p class="text-xs text-slate-400 uppercase font-bold tracking-wider">Tidak Dijawab</p>
                                            <p class="font-extrabold text-slate-400 text-2xl mt-1 flex items-center justify-center space-x-1.5">
                                                <i class="fa-regular fa-circle text-base"></i>
                                                <span>{result.unansweredCount}</span>
                                            </p>
                                        </div>
                                    </div>

                                    {/* Action Buttons to go home/retake */}
                                    <div class="p-6 flex flex-col sm:flex-row justify-center items-center gap-4">
                                        <button 
                                            onClick={restartAll}
                                            class="w-full sm:w-auto px-6 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold transition-all shadow-lg shadow-indigo-600/10 flex items-center justify-center space-x-2"
                                        >
                                            <i class="fa-solid fa-rotate-left"></i>
                                            <span>Mulai Ujian Baru (Ulangi)</span>
                                        </button>
                                        <button 
                                            onClick={() => window.print()}
                                            class="w-full sm:w-auto px-6 py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition-all flex items-center justify-center space-x-2"
                                        >
                                            <i class="fa-solid fa-print"></i>
                                            <span>Cetak Laporan Hasil</span>
                                        </button>
                                    </div>
                                </div>

                                {/* Review and Detailed Explanations section */}
                                <div class="space-y-6">
                                    <h3 class="text-xl font-extrabold text-slate-800 flex items-center space-x-2">
                                        <i class="fa-solid fa-list-check text-indigo-600"></i>
                                        <span>Kunci Jawaban & Pembahasan Ujian</span>
                                    </h3>

                                    <div class="space-y-6">
                                        {QUESTIONS_DATABASE.map((q, idx) => {
                                            const studentAns = answers[q.id];
                                            const isCorrect = studentAns === q.correctIndex;
                                            
                                            return (
                                                <div 
                                                    key={q.id}
                                                    class={`bg-white rounded-2xl shadow-sm border p-6 space-y-4 ${
                                                        studentAns === undefined 
                                                        ? 'border-l-4 border-l-slate-400 border-slate-200/80' 
                                                        : isCorrect 
                                                        ? 'border-l-4 border-l-emerald-500 border-slate-200/80' 
                                                        : 'border-l-4 border-l-red-500 border-slate-200/80'
                                                    }`}
                                                >
                                                    <div class="flex justify-between items-start gap-4">
                                                        <h4 class="font-bold text-slate-800 leading-relaxed">
                                                            <span class="text-indigo-600">{idx + 1}.</span> {q.question}
                                                        </h4>
                                                        {studentAns === undefined ? (
                                                            <span class="flex-shrink-0 bg-slate-100 text-slate-600 text-xs font-bold px-2.5 py-1 rounded-md flex items-center space-x-1">
                                                                <i class="fa-solid fa-circle"></i>
                                                                <span>Kosong</span>
                                                            </span>
                                                        ) : isCorrect ? (
                                                            <span class="flex-shrink-0 bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-1 rounded-md flex items-center space-x-1">
                                                                <i class="fa-solid fa-check"></i>
                                                                <span>Benar</span>
                                                            </span>
                                                        ) : (
                                                            <span class="flex-shrink-0 bg-red-100 text-red-800 text-xs font-bold px-2.5 py-1 rounded-md flex items-center space-x-1">
                                                                <i class="fa-solid fa-xmark"></i>
                                                                <span>Salah</span>
                                                            </span>
                                                        )}
                                                    </div>

                                                    {/* Options showing correct vs wrong selection */}
                                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pl-0 md:pl-5">
                                                        {q.options.map((opt, oIdx) => {
                                                            const isThisCorrect = oIdx === q.correctIndex;
                                                            const isThisStudentAns = oIdx === studentAns;
                                                            
                                                            let optClass = "border-slate-100 text-slate-600 bg-slate-50/50";
                                                            let icon = null;

                                                            if (isThisCorrect) {
                                                                optClass = "border-emerald-200 bg-emerald-50/50 text-emerald-900 font-medium";
                                                                icon = <i class="fa-solid fa-circle-check text-emerald-600 mr-2"></i>;
                                                            } else if (isThisStudentAns && !isCorrect) {
                                                                optClass = "border-red-200 bg-red-50/50 text-red-900 font-medium";
                                                                icon = <i class="fa-solid fa-circle-xmark text-red-600 mr-2"></i>;
                                                            }

                                                            return (
                                                                <div key={oIdx} class={`p-3 rounded-xl border text-sm flex items-center ${optClass}`}>
                                                                    {icon ? icon : <span class="w-2.5 h-2.5 rounded-full bg-slate-200 mr-2 inline-block"></span>}
                                                                    <span>{opt}</span>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>

                                                    {/* Deep Academic Explanation Block */}
                                                    <div class="bg-indigo-50/50 border border-indigo-100 rounded-xl p-4 text-xs md:text-sm text-slate-700 leading-relaxed mt-2">
                                                        <p class="font-extrabold text-indigo-900 uppercase tracking-wider text-[10px] mb-1">Pembahasan Soal:</p>
                                                        {q.explanation}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer brand */}
                    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400 mt-12">
                        <div class="max-w-7xl mx-auto px-6">
                            <p>© 2026 Aplikasi CBT Online Akademik. Seluruh Hak Cipta Dilindungi.</p>
                            <p class="mt-1 text-slate-300">Komputer dan Masyarakat - Program Studi Teknik Informatika & Sistem Informasi</p>
                        </div>
                    </footer>

                    {/* CONFIRMATION DIALOG MODAL (Never alert) */}
                    {showSubmitModal && (
                        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in">
                            <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl p-6 space-y-6 border border-slate-100">
                                <div class="text-center">
                                    <div class="inline-flex bg-red-100 text-red-600 p-4 rounded-full mb-3">
                                        <i class="fa-solid fa-triangle-exclamation text-3xl"></i>
                                    </div>
                                    <h3 class="text-xl font-extrabold text-slate-800">Selesaikan Ujian?</h3>
                                    <p class="text-slate-500 text-sm mt-1">
                                        Anda masih memiliki waktu sisa. Apakah Anda yakin ingin mengirim semua lembar jawaban sekarang? Tindakan ini tidak dapat dibatalkan.
                                    </p>
                                </div>

                                <div class="bg-slate-50 p-4 rounded-xl space-y-2 text-xs text-slate-600">
                                    <div class="flex justify-between">
                                        <span>Total Soal:</span>
                                        <span class="font-bold">50</span>
                                    </div>
                                    <div class="flex justify-between">
                                        <span>Sudah Dijawab:</span>
                                        <span class="font-bold text-emerald-600">{answeredTotal}</span>
                                    </div>
                                    <div class="flex justify-between">
                                        <span>Belum Dijawab:</span>
                                        <span class="font-bold text-red-500">{50 - answeredTotal}</span>
                                    </div>
                                </div>

                                <div class="flex space-x-3">
                                    <button 
                                        onClick={() => setShowSubmitModal(false)}
                                        class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm transition-all"
                                    >
                                        Kembali Mengerjakan
                                    </button>
                                    <button 
                                        onClick={handleSubmitExam}
                                        class="flex-1 py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-sm shadow-lg shadow-red-600/20 transition-all"
                                    >
                                        Ya, Selesai & Kirim
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Render React Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
